name: External public control verify

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: external-public-control-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: External strict verify
        run: npm run verify:strict

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verifrax-external-public-control-verify-report
          path: reports/public-control-verify.latest.json

  deploy-report:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verifrax-external-public-control-verify-report
          path: reports

      - name: Prepare public verifier report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/reports
          cp reports/public-control-verify.latest.json public/reports/public-control-verify.latest.json
          python3 -m json.tool public/reports/public-control-verify.latest.json >/dev/null
          grep -q "VERIFRAX_EXTERNAL_CONTROL_VERIFY_GREEN" public/reports/public-control-verify.latest.json
          grep -q '"system_complete": false' public/reports/public-control-verify.latest.json
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>VERIFRAX External Control Verify</title>
            <style>
              body{margin:0;background:#0f1115;color:#f4f5f7;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
              main{max-width:960px;margin:0 auto;padding:48px 20px 72px}
              h1{font-size:clamp(38px,7vw,78px);line-height:.92;margin:0;letter-spacing:-.05em}
              .panel{border:1px solid #303846;background:#171b22;border-radius:18px;padding:22px;margin-top:22px}
              a{color:#8ab4ff}code{border:1px solid #303846;border-radius:8px;padding:2px 6px}.muted{color:#a4acb8}
            </style>
          </head>
          <body>
            <main>
              <div class="muted">VERIFRAX / external-control-verify</div>
              <h1>External control verifier.</h1>
              <section class="panel">
                <h2><code>VERIFRAX_EXTERNAL_CONTROL_VERIFY_GREEN</code></h2>
                <p>This external verifier replays the public control fixed point from outside the root and status repositories.</p>
                <p>Machine report: <a href="./reports/public-control-verify.latest.json">reports/public-control-verify.latest.json</a></p>
                <p>System complete: <code>false</code></p>
              </section>
            </main>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
