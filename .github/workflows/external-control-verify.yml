name: External public control verify

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: external-public-control-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - id: external_verify
        name: External strict verify
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run verify:strict

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verifrax-external-public-control-verify-report
          path: reports/public-control-verify.latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce verifier outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.external_verify.outcome }}" = "success"

  deploy-report:
    if: always() && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verifrax-external-public-control-verify-report
          path: reports

      - name: Validate and render public report
        run: |
          set -euo pipefail
          python3 -m json.tool reports/public-control-verify.latest.json >/dev/null
          npm run render:report

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
